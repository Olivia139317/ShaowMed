services:
  mock-backend:
    build:
      context: ../../mock-backend
    image: shadowme-mock-backend:latest
    container_name: shadowme-mock-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - shadowme

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    depends_on:
      - mock-backend
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./openclaw-data:/home/node/.openclaw
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured"]
    networks:
      - shadowme

networks:
  shadowme:
    name: shadowme-cloud
